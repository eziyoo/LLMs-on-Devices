# Copy this file to experiment/config.ini (gitignored) and edit it.
# RunnerConfig.py and the helper scripts in experiment/ read it.

[device]
# ADB serial of the phone, exactly as shown by `adb devices` (IP:port for wireless ADB)
device_id = 192.168.43.162:5555
adb_path = adb
remote_dir = /data/local/tmp

[paths]
# Folder with llama-cli, lib*.so and libomp.so cross-compiled for Android (see docs/REPRODUCE.md §5)
llama_build_dir = ~/llm_on_device/llama.cpp/build-android/bin
# Folder with the .gguf files (see docs/REPRODUCE.md §6). Only the model under test is pushed.
model_dir = ~/llm_on_device/models

[run]
# Model under test for this round: one of the 16 file names in docs/REPRODUCE.md §6
model = qwen2-0_5b-instruct-q4_k_m.gguf
repetitions = 30
# Pause between runs, to let the phone cool down
cooldown_seconds = 200
# Idle current in amperes subtracted from every sample. Measure yours with measure_baseline.py.
baseline_current_a = 0.10
